name: Periodic Security Validation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_FUZZ_VERSION: "0.13.2"
  FUZZ_TOOLCHAIN: "nightly-2026-09-28"
  PROJECT_TOOLCHAIN: "1.89.0"

jobs:
  process-execution-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      - name: forbidden research components
        run: scripts/check-no-research-components.sh
      - name: fuzz smoke (persistent envelope parser, 60s)
        run: |
          set -euo pipefail
          mkdir -p fuzz/corpus/persistence_blob fuzz/artifacts/persistence_blob
          cargo +"${FUZZ_TOOLCHAIN}" install cargo-fuzz \
            --version "${CARGO_FUZZ_VERSION}" --locked
          timeout --signal=TERM --kill-after=15s 120s \
            cargo +"${FUZZ_TOOLCHAIN}" fuzz run persistence_blob -- \
            -max_total_time=60 -artifact_prefix=fuzz/artifacts/persistence_blob/
      - name: retain fuzz corpus and crash artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: persistence-fuzz-${{ github.sha }}
          path: |
            fuzz/corpus/persistence_blob/
            fuzz/artifacts/persistence_blob/
          if-no-files-found: warn
          retention-days: 30

  reproducibility:
    name: two clean builds compared
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ env.PROJECT_TOOLCHAIN }}
      - name: build A
        run: |
          cargo +"${PROJECT_TOOLCHAIN}" build --release --locked \
            --features llm --bin ccos
          sha256sum target/release/ccos > /tmp/build_a.sha
      - name: build B (clean)
        run: |
          cargo +"${PROJECT_TOOLCHAIN}" clean
          cargo +"${PROJECT_TOOLCHAIN}" build --release --locked \
            --features llm --bin ccos
          sha256sum target/release/ccos > /tmp/build_b.sha
      - name: compare
        run: |
          diff /tmp/build_a.sha /tmp/build_b.sha && echo "REPRODUCIBLE" || { echo "BUILD DIFFERS — investigate before claiming reproducibility"; exit 1; }
